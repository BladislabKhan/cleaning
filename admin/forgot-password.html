<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АкваБлеск — Восстановление доступа</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../assets/site.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-body">
  <section class="auth-shell">
    <div class="auth-backdrop"></div>
    <div class="auth-card">
      <p class="auth-kicker">Восстановление доступа</p>
      <h1>Забыли пароль?</h1>
      <p class="auth-lead">Введите e-mail администратора. Если адрес найден, на него будет отправлена ссылка для восстановления доступа.</p>
      <form class="auth-form" data-forgot-form novalidate>
        <label class="field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" placeholder="Введите e-mail" required>
        </label>
        <button class="button button-primary button-large" type="submit">Отправить ссылку</button>
        <p class="status-line" data-forgot-status aria-live="polite"></p>
      </form>
      <div class="auth-links">
        <a href="./index.html">Вернуться ко входу</a>
      </div>
    </div>
  </section>

  <script src="./forgot-password.js"></script>
</body>
</html>
