<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АкваБлеск — Новый доступ</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../assets/site.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-body">
  <section class="auth-shell">
    <div class="auth-backdrop"></div>
    <div class="auth-card">
      <p class="auth-kicker">Сброс доступа</p>
      <h1>Новый логин и пароль</h1>
      <p class="auth-lead">Укажите новый логин и новый пароль для входа в админку.</p>
      <form class="auth-form" data-reset-form novalidate>
        <label class="field">
          <span>Новый логин</span>
          <input type="text" name="username" autocomplete="username" placeholder="Введите логин" required>
        </label>
        <label class="field">
          <span>Новый пароль</span>
          <input type="password" name="newPassword" autocomplete="new-password" placeholder="Не менее 8 символов" required>
        </label>
        <button class="button button-primary button-large" type="submit">Обновить доступ</button>
        <p class="status-line" data-reset-status aria-live="polite"></p>
      </form>
      <div class="auth-links">
        <a href="./index.html">Вернуться ко входу</a>
      </div>
    </div>
  </section>

  <script src="./reset-password.js"></script>
</body>
</html>
